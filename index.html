<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GPA Pro — 5.0 Scale</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #080c14;
    --surface: #0d1422;
    --surface2: #111827;
    --border: rgba(99,179,237,0.12);
    --accent: #38bdf8;
    --accent2: #818cf8;
    --gold: #fbbf24;
    --red: #f87171;
    --green: #34d399;
    --text: #e2e8f0;
    --muted: #64748b;
    --glow: rgba(56,189,248,0.15);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Ambient background */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(56,189,248,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 50% 50% at 80% 80%, rgba(129,140,248,0.07) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  .grid-bg {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(99,179,237,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,179,237,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .container {
    position: relative; z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* Header */
  header {
    margin-bottom: 48px;
    animation: fadeDown 0.6s ease both;
  }
  .header-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(56,189,248,0.08);
    border: 1px solid rgba(56,189,248,0.2);
    border-radius: 100px;
    padding: 5px 14px;
    font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 16px;
  }
  .dot { width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite;}
  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  h1 span { color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 13px; margin-top: 8px; }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.5s ease both;
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(56,189,248,0.4), transparent);
  }

  .card-label {
    font-family: 'Syne', sans-serif;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 20px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .card-label::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--border), transparent);
  }

  /* CGPA Row */
  .cgpa-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }
  .input-group { display: flex; flex-direction: column; gap: 8px; }
  .input-group label { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }

  input[type="number"], select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    padding: 12px 16px;
    outline: none;
    width: 100%;
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
  }
  input[type="number"]:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(56,189,248,0.1);
  }
  select { cursor: pointer; }
  select option { background: #1e293b; }

  /* Subjects table */
  .subjects-header {
    display: grid;
    grid-template-columns: 1fr 140px 100px 44px;
    gap: 12px;
    padding: 0 0 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .subjects-header span {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
  }

  .subject-row {
    display: grid;
    grid-template-columns: 1fr 140px 100px 44px;
    gap: 12px;
    align-items: center;
    margin-bottom: 10px;
    animation: slideIn 0.25s ease both;
  }

  .subject-name-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 10px 14px;
    outline: none;
    width: 100%;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .subject-name-input:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px rgba(129,140,248,0.1);
  }
  .subject-name-input::placeholder { color: var(--muted); }

  .hours-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    width: 100%;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .hours-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,0.1); }

  .grade-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 10px 10px;
    outline: none;
    width: 100%;
    transition: border-color 0.2s;
    cursor: pointer;
  }
  .grade-select:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(129,140,248,0.1); }
  .grade-select option { background: #1e293b; }

  .remove-btn {
    width: 36px; height: 36px;
    background: rgba(248,113,113,0.08);
    border: 1px solid rgba(248,113,113,0.2);
    border-radius: 8px;
    color: var(--red);
    font-size: 16px; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, transform 0.1s;
    flex-shrink: 0;
  }
  .remove-btn:hover { background: rgba(248,113,113,0.18); transform: scale(1.05); }

  /* Actions */
  .actions {
    display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap;
  }
  .btn {
    font-family: 'Syne', sans-serif;
    font-weight: 600; font-size: 13px;
    letter-spacing: 0.05em;
    border-radius: 10px;
    padding: 12px 24px;
    border: none; cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 8px;
  }
  .btn-add {
    background: rgba(56,189,248,0.1);
    border: 1px solid rgba(56,189,248,0.25);
    color: var(--accent);
  }
  .btn-add:hover { background: rgba(56,189,248,0.18); transform: translateY(-1px); }
  .btn-calc {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #0a1628;
    box-shadow: 0 4px 20px rgba(56,189,248,0.25);
  }
  .btn-calc:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(56,189,248,0.35); }
  .btn-reset {
    background: rgba(248,113,113,0.08);
    border: 1px solid rgba(248,113,113,0.2);
    color: var(--red);
  }
  .btn-reset:hover { background: rgba(248,113,113,0.15); }

  /* Results */
  .results-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 20px;
    display: none;
    animation: fadeUp 0.4s ease both;
  }
  .results-card.visible { display: block; }
  .results-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px;
    margin-top: 16px;
  }
  .result-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    position: relative; overflow: hidden;
  }
  .result-box::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  }
  .result-box.sem::before { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .result-box.cgpa::before { background: linear-gradient(90deg, var(--gold), #f97316); }
  .result-box.change::before { background: linear-gradient(90deg, var(--green), #10b981); }

  .result-label {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
    margin-bottom: 10px;
  }
  .result-value {
    font-family: 'Syne', sans-serif;
    font-size: 36px; font-weight: 800; line-height: 1;
  }
  .result-value.sem { color: var(--accent); }
  .result-value.cgpa { color: var(--gold); }
  .result-value.up { color: var(--green); }
  .result-value.down { color: var(--red); }
  .result-value.same { color: var(--muted); }

  .result-sub {
    font-size: 11px; color: var(--muted); margin-top: 6px;
  }

  /* Grade bar chart */
  .chart-section { margin-top: 28px; }
  .chart-label { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 14px; }
  .bar-wrap { margin-bottom: 10px; }
  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .bar-name { font-size: 12px; color: var(--muted); width: 110px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; background: var(--surface2); border-radius: 4px; height: 8px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
  .bar-val { font-size: 12px; width: 36px; text-align: right; color: var(--text); }

  /* Grade colors */
  .g-aplus { background: linear-gradient(90deg, #34d399, #10b981); }
  .g-a     { background: linear-gradient(90deg, #38bdf8, #0ea5e9); }
  .g-bplus { background: linear-gradient(90deg, #818cf8, #6366f1); }
  .g-b     { background: linear-gradient(90deg, #a78bfa, #8b5cf6); }
  .g-cplus { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
  .g-c     { background: linear-gradient(90deg, #fb923c, #f97316); }
  .g-dplus { background: linear-gradient(90deg, #f87171, #ef4444); }
  .g-d     { background: linear-gradient(90deg, #ef4444, #dc2626); }
  .g-f     { background: linear-gradient(90deg, #94a3b8, #64748b); }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px; z-index
